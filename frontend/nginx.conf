server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Compresión Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy para microservicios internos en la red Docker / Azure Container Apps.
    # Los endpoints de orquestación son exclusivamente internos. Las llamadas
    # legítimas se realizan directamente entre servicios, no a través del frontend.
    location ~ ^/api/inventario/(descontar|reponer)/?$ { return 404; }

    location ~ ^/api/facturas/?$ {
        limit_except GET { deny all; }
        set $target_facturacion "${FACTURACION_SERVICE_URL}";
        proxy_pass $target_facturacion;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/clientes {
        set $target_clientes "${CLIENTES_SERVICE_URL}";
        proxy_pass $target_clientes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/productos {
        set $target_productos "${PRODUCTOS_SERVICE_URL}";
        proxy_pass $target_productos;
        proxy_ssl_server_name on;
        proxy_ssl_name productos-service.thankfulcoast-dd9c4d85.brazilsouth.azurecontainerapps.io;
        proxy_set_header Host productos-service.thankfulcoast-dd9c4d85.brazilsouth.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/inventario {
        set $target_inventario "${INVENTARIO_SERVICE_URL}";
        proxy_pass $target_inventario;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ventas {
        set $target_ventas "${VENTAS_SERVICE_URL}";
        proxy_pass $target_ventas;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/solicitudes {
        set $target_solicitudes "${VENTAS_SERVICE_URL}";
        proxy_pass $target_solicitudes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/conversaciones {
        set $target_conversaciones "${VENTAS_SERVICE_URL}";
        proxy_pass $target_conversaciones;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/facturas {
        set $target_facturacion "${FACTURACION_SERVICE_URL}";
        proxy_pass $target_facturacion;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
