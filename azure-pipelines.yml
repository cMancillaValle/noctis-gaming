# ==============================================================================
# NOCTIS GAMING - Integración continua (CI)
#
# Esta definición valida el backend y el frontend, y publica imágenes en ACR.
# El despliegue se incorporará más adelante, cuando exista la infraestructura y
# las conexiones de servicio necesarias.
# ==============================================================================

# Ejecutar CI para cambios en la rama principal. Los filtros de ruta evitan una
# ejecución cuando el cambio está limitado exclusivamente a documentación.
trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - docs/**
      - README.md

pr: none

variables:
  vmImageName: 'ubuntu-latest'
  javaVersion: '21'
  nodeVersion: '20.x'
  # Nombre de la conexión de servicio Docker Registry ya autorizada en Azure DevOps.
  acrServiceConnection: 'sc-acr-noctis-gaming'
  # Etiqueta inmutable e identificable por compilación para despliegues trazables en ACA / Bicep
  imageTag: '1.0.$(Build.BuildId)'

stages:
  # ============================================================================
  # ETAPA 1: VALIDACIÓN DEL BACKEND (cinco microservicios Maven)
  # ============================================================================
  - stage: Backend
    displayName: '1. Backend: compilación, pruebas y artefactos'
    jobs:
      - job: BuildTestPackage
        displayName: 'Compilar y probar microservicios'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: JavaToolInstaller@0
            displayName: 'Configurar JDK 21'
            inputs:
              versionSpec: '$(javaVersion)'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          # El pom raíz agrega los cinco módulos bajo services/.
          - task: Maven@4
            displayName: 'Compilar, probar y empaquetar backend'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'clean verify'
              options: '-B'
              publishJUnitResults: false
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.21'

          # Los reportes se publican solo si Surefire los generó; no se fuerza
          # una dependencia de pruebas inexistentes.
          - task: PublishTestResults@2
            displayName: 'Publicar resultados JUnit del backend'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/target/surefire-reports/TEST-*.xml'
              searchFolder: '$(System.DefaultWorkingDirectory)'
              mergeTestResults: true
              failTaskOnMissingResultsFile: false
              testRunTitle: 'Pruebas unitarias backend'

          - task: CopyFiles@2
            displayName: 'Preparar artefactos JAR'
            condition: succeeded()
            inputs:
              SourceFolder: '$(System.DefaultWorkingDirectory)'
              Contents: 'services/*/target/*.jar'
              TargetFolder: '$(Build.ArtifactStagingDirectory)/backend'
              flattenFolders: true

          - task: PublishPipelineArtifact@1
            displayName: 'Publicar artefactos JAR'
            condition: succeeded()
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/backend'
              artifact: 'backend-jars'
              publishLocation: 'pipeline'

  # ============================================================================
  # ETAPA 2: VALIDACIÓN DEL FRONTEND
  # ============================================================================
  - stage: Frontend
    displayName: '2. Frontend: dependencias y compilación'
    dependsOn: Backend
    condition: succeeded()
    jobs:
      - job: BuildFrontend
        displayName: 'Instalar y compilar React/Vite'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: NodeTool@0
            displayName: 'Configurar Node.js 20.x'
            inputs:
              versionSpec: '$(nodeVersion)'

          - script: |
              npm ci
              npm run build
            workingDirectory: 'frontend'
            displayName: 'Instalar dependencias y compilar frontend'

  # ============================================================================
  # ETAPA 3: CONSTRUCCIÓN Y PUBLICACIÓN DE IMÁGENES EN ACR
  # ============================================================================
  - stage: DockerBuildAndPush
    displayName: '3. Docker: construir y publicar imágenes en ACR'
    dependsOn: Frontend
    # La publicación queda restringida a ejecuciones exitosas de la rama main.
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildAndPushImages
        displayName: 'Construir y publicar imágenes Docker'
        pool:
          vmImage: $(vmImageName)
        steps:
          # Cada Dockerfile es multietapa y compila con su contexto específico.
          # Las tareas se ejecutan en serie para evitar trabajos paralelos innecesarios.
          - task: Docker@2
            displayName: 'Publicar clientes-service'
            inputs:
              command: 'buildAndPush'
              containerRegistry: '$(acrServiceConnection)'
              repository: 'noctis/clientes-service'
              dockerfile: 'services/clientes-service/Dockerfile'
              buildContext: 'services/clientes-service'
              tags: |
                $(imageTag)
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Publicar productos-service'
            inputs:
              command: 'buildAndPush'
              containerRegistry: '$(acrServiceConnection)'
              repository: 'noctis/productos-service'
              dockerfile: 'services/productos-service/Dockerfile'
              buildContext: 'services/productos-service'
              tags: |
                $(imageTag)
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Publicar inventario-service'
            inputs:
              command: 'buildAndPush'
              containerRegistry: '$(acrServiceConnection)'
              repository: 'noctis/inventario-service'
              dockerfile: 'services/inventario-service/Dockerfile'
              buildContext: 'services/inventario-service'
              tags: |
                $(imageTag)
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Publicar ventas-service'
            inputs:
              command: 'buildAndPush'
              containerRegistry: '$(acrServiceConnection)'
              repository: 'noctis/ventas-service'
              dockerfile: 'services/ventas-service/Dockerfile'
              buildContext: 'services/ventas-service'
              tags: |
                $(imageTag)
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Publicar facturacion-service'
            inputs:
              command: 'buildAndPush'
              containerRegistry: '$(acrServiceConnection)'
              repository: 'noctis/facturacion-service'
              dockerfile: 'services/facturacion-service/Dockerfile'
              buildContext: 'services/facturacion-service'
              tags: |
                $(imageTag)
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Publicar noctis-frontend'
            inputs:
              command: 'buildAndPush'
              containerRegistry: '$(acrServiceConnection)'
              repository: 'noctis/noctis-frontend'
              dockerfile: 'frontend/Dockerfile'
              buildContext: 'frontend'
              tags: |
                $(imageTag)
                $(Build.BuildId)
                latest

# Futuro CD (intencionalmente fuera de esta ejecución):
# - Despliegue de manifiestos en Azure Kubernetes Service (AKS).
# - Consumo de secretos desde Azure Key Vault mediante conexiones de servicio.
