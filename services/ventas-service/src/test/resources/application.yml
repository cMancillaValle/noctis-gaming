server:
  port: 0

spring:
  application:
    name: ventas-service-test
  datasource:
    url: jdbc:h2:mem:ventas_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

services:
  clientes:
    url: http://localhost:8081
  productos:
    url: http://localhost:8082
  inventario:
    url: http://localhost:8083
  facturacion:
    url: http://localhost:8085

management:
  endpoints:
    web:
      exposure:
        include: health
