# Configuración de Producción Estricta - Ventas Service
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:ventas_db}?sslmode=${POSTGRES_SSLMODE:require}}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

security:
  jwt:
    secret: ${JWT_SECRET}

services:
  clientes:
    url: ${SERVICES_CLIENTES_URL:http://clientes-service}
  productos:
    url: ${SERVICES_PRODUCTOS_URL:http://productos-service}
  inventario:
    url: ${SERVICES_INVENTARIO_URL:http://inventario-service}
  facturacion:
    url: ${SERVICES_FACTURACION_URL:http://facturacion-service}
  http:
    connect-timeout: ${SERVICES_HTTP_CONNECT_TIMEOUT:2s}
    read-timeout: ${SERVICES_HTTP_READ_TIMEOUT:5s}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
