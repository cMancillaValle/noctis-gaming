server:
  port: ${PORT:8084}

spring:
  application:
    name: ventas-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ventas_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

security:
  jwt:
    secret: ${JWT_SECRET:}

services:
  clientes:
    url: ${SERVICES_CLIENTES_URL:http://localhost:8081}
  productos:
    url: ${SERVICES_PRODUCTOS_URL:http://localhost:8082}
  inventario:
    url: ${SERVICES_INVENTARIO_URL:http://localhost:8083}
  facturacion:
    url: ${SERVICES_FACTURACION_URL:http://localhost:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
