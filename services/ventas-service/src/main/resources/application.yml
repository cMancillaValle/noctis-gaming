server:
  port: ${PORT:8084}

spring:
  application:
    name: ventas-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ventas_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

security:
  jwt:
    secret: ${JWT_SECRET:}

services:
  clientes:
    url: ${SERVICES_CLIENTES_URL:http://localhost:8081}
  productos:
    url: ${SERVICES_PRODUCTOS_URL:http://localhost:8082}
  inventario:
    url: ${SERVICES_INVENTARIO_URL:http://localhost:8083}
  facturacion:
    url: ${SERVICES_FACTURACION_URL:http://localhost:8085}
  http:
    connect-timeout: ${SERVICES_HTTP_CONNECT_TIMEOUT:2s}
    read-timeout: ${SERVICES_HTTP_READ_TIMEOUT:5s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
