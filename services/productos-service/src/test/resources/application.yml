server:
  port: 0

spring:
  application:
    name: productos-service-test
  datasource:
    url: jdbc:h2:mem:productos_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

security:
  jwt:
    secret: "TestSecretKeyForTestingPurposesOnlyNeedsToBeLongEnough2026!"

admin:
  api-key: "test-admin-key"

management:
  endpoints:
    web:
      exposure:
        include: health
