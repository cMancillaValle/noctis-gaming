server:
  port: 0

spring:
  application:
    name: facturacion-service-test
  datasource:
    url: jdbc:h2:mem:facturacion_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health
