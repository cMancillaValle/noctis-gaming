apiVersion: v1
kind: Secret
metadata:
  name: noctis-secrets
  namespace: noctis-gaming
type: Opaque
stringData:
  # En Azure Kubernetes Service (AKS), estos valores se sincronizan
  # de forma nativa a través del Azure Key Vault Secrets Store CSI Driver
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "REPLACE_WITH_KEY_VAULT_POSTGRES_PASSWORD"
  ADMIN_API_KEY: "REPLACE_WITH_KEY_VAULT_ADMIN_API_KEY"
